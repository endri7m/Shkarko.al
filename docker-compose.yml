version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sonicflow_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sonicflow
      POSTGRES_USER: sonicflow_user
      POSTGRES_PASSWORD: sonicflow_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonicflow_user -d sonicflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sonicflow_queue
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: sonicflow_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-01-28T22-40-50Z
    container_name: sonicflow_storage_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/sonicflow-bucket;
      mc anonymous set download local/sonicflow-bucket;
      mc ilm rule add --expire-days 0 --expire-hours 1 local/sonicflow-bucket;
      echo 'Bucket created with 1-hour expiration policy';
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sonicflow_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://sonicflow_user:sonicflow_password@postgres:5432/sonicflow?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=sonicflow-bucket
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: sonicflow_worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://sonicflow_user:sonicflow_password@postgres:5432/sonicflow?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=sonicflow-bucket
      - S3_REGION=us-east-1
    volumes:
      - /tmp/sonicflow-scratch:/tmp/sonicflow-scratch
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sonicflow_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
