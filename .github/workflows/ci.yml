name: SonicFlow CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm ci

    - name: Verify Shared Package Compilation
      run: npm run build -w packages/shared

    - name: Run Backend Compiler Checks
      run: npm run build -w apps/backend

    - name: Run Worker Compiler Checks
      run: run: npm run build -w apps/worker

    - name: Build Next.js Production Bundle
      run: npm run build -w apps/frontend

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Docker Compose Build
      run: docker compose build
